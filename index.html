<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEONFALL: XENO HUNT</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#eef6ff;font-family:Arial,sans-serif}body{display:grid;place-items:center}#w{position:relative;width:min(1280px,100vw);height:min(800px,100vh);background:#050914;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between}.p{background:#07101dcc;border:1px solid #314866;border-radius:12px;padding:10px 13px;backdrop-filter:blur(7px)}.bar{width:280px;height:9px;background:#182237;border-radius:99px;overflow:hidden;margin-top:6px}.hp,.xp{height:100%}.hp{background:linear-gradient(90deg,#ff315f,#ff8d67)}.xp{background:linear-gradient(90deg,#40ddff,#906bff)}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#02050ad9;z-index:5}.card{width:min(720px,92%);background:#0b1323;border:1px solid #293b5c;border-radius:18px;padding:28px;text-align:center;box-shadow:0 30px 100px #000}button,input{font:inherit;border-radius:10px;padding:11px 14px}button{background:#162645;color:#fff;border:1px solid #405c88;cursor:pointer}input{background:#07101d;color:#fff;border:1px solid #344b70}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.choice{text-align:left;min-height:120px}.choice b{display:block;margin-bottom:8px}.board{width:100%;border-collapse:collapse;margin-top:15px;text-align:left}.board td,.board th{padding:8px;border-bottom:1px solid #24324a}.boss{position:absolute;top:82px;left:50%;transform:translateX(-50%);width:min(560px,58vw);display:none}.boss .bar{width:100%}@media(max-width:700px){.bar{width:190px}.choices{grid-template-columns:1fr}}</style></head><body><div id="w"><canvas id="g"></canvas><div class="hud"><div class="top"><div class="p"><b id="lv">Lv 1</b> · <span id="wa">Wave 1</span> · ☠ <span id="ki">0</span><div class="bar"><div class="hp" id="hp"></div></div><div class="bar"><div class="xp" id="xp"></div></div></div><div class="p">✦ <span id="sc">0</span> · 💰 <span id="go">0</span></div></div><div class="p boss" id="bb"><b id="bn">BOSS</b><div class="bar"><div class="hp" id="bh"></div></div></div></div><div class="overlay" id="start" style="display:flex"><div class="card"><h1>NEONFALL: XENO HUNT</h1><p>Uzay geminle hayatta kal. Her 5. wave korkutucu bir Xeno Guardian gelir.</p><p>WASD hareket · Mouse nişan · Sol tık ateş · Space dash · P pause · L leaderboard</p><input id="name" maxlength="14" value="Pilot" placeholder="Pilot adı"> <button id="play">START RUN</button> <button id="lb0">LEADERBOARD</button></div></div><div class="overlay" id="up"><div class="card"><h2>LEVEL UP</h2><div class="choices" id="choices"></div></div></div><div class="overlay" id="pause"><div class="card"><h2>PAUSED</h2><p>P ile devam et</p></div></div><div class="overlay" id="board"><div class="card"><h2>LEADERBOARD</h2><div id="tbl"></div><br><button id="close">CLOSE</button></div></div><div class="overlay" id="over"><div class="card"><h2>RUN OVER</h2><p id="res"></p><button id="again">PLAY AGAIN</button> <button id="lb1">LEADERBOARD</button></div></div></div><script>'use strict';const c=document.getElementById('g'),x=c.getContext('2d'),W=1280,H=800,K={},M={x:640,y:400,d:0};let S={},P={};function size(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d*r.width/W,0,0,d*r.height/H,0,0)}size();addEventListener('resize',size);addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.code==='Space')dash();if(e.key.toLowerCase()==='p'&&S.run&&!S.level){S.pause=!S.pause;pause.style.display=S.pause?'flex':'none'}if(e.key.toLowerCase()==='l')showBoard()});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);c.onmousemove=e=>{let r=c.getBoundingClientRect();M.x=(e.clientX-r.left)/r.width*W;M.y=(e.clientY-r.top)/r.height*H};c.onmousedown=()=>M.d=1;onmouseup=()=>M.d=0;const BI=[['ORBITAL GRAVEYARD','#050914','#34465d'],['CRIMSON NEBULA','#12060e','#6b1c45'],['DERELICT SECTOR','#07100f','#2e5651'],['VOID RIFT','#06040d','#4a2a72']];function reset(){S={run:1,pause:0,level:0,t:0,w:1,k:0,score:0,gold:0,spawn:0,boss:0,en:[],bu:[],gem:[],pt:[],obs:[],pilot:(name.value.trim()||'Pilot').slice(0,14)};P={x:640,y:420,r:16,hp:120,mhp:120,xp:0,nxp:60,lv:1,spd:255,dmg:23,rate:5.4,bs:760,crit:.08,multi:1,pierce:0,ls:0,mag:110,cd:0,fire:0,inv:0};start.style.display=over.style.display=board.style.display='none';build()}function build(){S.obs=[];for(let i=0;i<6+(S.w%5);i++){let o;do{o={x:100+Math.random()*1080,y:120+Math.random()*610,r:20+Math.random()*38}}while(Math.hypot(o.x-P.x,o.y-P.y)<160);S.obs.push(o)}}const U=[['Overclock','+22% fire rate',()=>P.rate*=1.22],['Heavy Rounds','+32% damage',()=>P.dmg*=1.32],['Reinforced Hull','+35 max HP + heal',()=>{P.mhp+=35;P.hp=Math.min(P.mhp,P.hp+35)}],['Multishot','+1 projectile',()=>P.multi++],['Piercing','+1 pierce',()=>P.pierce++],['Vampiric Core','+4% gerçek lifesteal',()=>P.ls+=.04],['Magnet','pickup range +90',()=>P.mag+=90],['Critical Core','crit chance +9%',()=>P.crit+=.09],['Thrusters','speed +18%',()=>P.spd*=1.18]];function level(){S.level=1;P.lv++;P.xp-=P.nxp;P.nxp=Math.floor(P.nxp*1.35+14);choices.innerHTML='';[...U].sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+u[0]+'</b><small>'+u[1]+'</small>';b.onclick=()=>{u[2]();S.level=0;up.style.display='none'};choices.appendChild(b)});up.style.display='flex'}function xp(v){P.xp+=v;if(P.xp>=P.nxp&&!S.level)level()}function spawn(type,boss=0){let a=Math.random()*Math.PI*2,r=520,xp0=640+Math.cos(a)*r,yp0=420+Math.sin(a)*r,scale=1+S.w*.13,D={drone:[17,55,86,9,'#ff527d',11],stalker:[13,36,145,8,'#ffb24b',13],brute:[27,150,48,18,'#9d6cff',24],spitter:[16,65,60,10,'#52e5c3',17]};if(boss){let names=['THE HARVESTER','VOID MOTHER','BONE STAR','ABYSSAL EYE'];S.en.push({x:640,y:120,r:56,hp:2400+S.w*420,mhp:2400+S.w*420,spd:55,dmg:28,col:'#ff2d76',xp:300,boss:1,name:names[(S.w/5-1)%4|0],shot:1,phase:0});S.boss=1;return}let d=D[type];S.en.push({x:xp0,y:yp0,r:d[0],hp:d[1]*scale,spd:d[2]+S.w*1.7,dmg:d[3],col:d[4],xp:d[5],type,shot:1+Math.random()*2})}function shoot(){if(P.fire>0)return;P.fire=1/P.rate;let a=Math.atan2(M.y-P.y,M.x-P.x);for(let i=0;i<P.multi;i++){let z=a+(i-(P.multi-1)/2)*.12,crit=Math.random()<P.crit;S.bu.push({x:P.x,y:P.y,vx:Math.cos(z)*P.bs,vy:Math.sin(z)*P.bs,r:5,dmg:P.dmg*(crit?2:1),life:1.6,p:P.pierce,enemy:0})}}function dash(){if(!S.run||S.pause||S.level||P.cd>0)return;let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(!dx&&!dy){dx=M.x-P.x;dy=M.y-P.y}let l=Math.hypot(dx,dy)||1;P.x+=dx/l*115;P.y+=dy/l*115;P.cd=1.25;P.inv=.25}function hit(e,b){let dealt=Math.min(e.hp,b.dmg);e.hp-=b.dmg;if(P.ls>0&&dealt>0)P.hp=Math.min(P.mhp,P.hp+dealt*P.ls);if(e.hp<=0){S.en.splice(S.en.indexOf(e),1);S.k++;S.score+=e.boss?1800:Math.floor(20+e.xp*3);S.gold+=e.boss?100:Math.ceil(e.xp/2);S.gem.push({x:e.x,y:e.y,v:e.xp});if(e.boss){S.boss=0;S.w++;build()}}}function upd(dt){if(!S.run||S.pause||S.level)return;S.t+=dt;P.fire-=dt;P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);let dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),l=Math.hypot(dx,dy)||1;P.x=Math.max(25,Math.min(W-25,P.x+dx/l*P.spd*dt));P.y=Math.max(80,Math.min(H-25,P.y+dy/l*P.spd*dt));if(M.d)shoot();if(!S.boss&&S.w%5===0&&S.en.length===0)spawn('',1);S.spawn-=dt;if(!S.boss&&S.spawn<=0&&S.en.length<Math.min(8+S.w*2,28)){let r=Math.random();spawn(r<.5?'drone':r<.72?'stalker':r<.88?'spitter':'brute');S.spawn=Math.max(.25,1.05-S.w*.025)}if(!S.boss&&S.w%5!==0&&S.t>S.w*30){S.w++;S.en=[];build()}for(let b of S.bu){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.enemy){if(Math.hypot(b.x-P.x,b.y-P.y)<b.r+P.r&&P.inv<=0){P.hp-=b.dmg;b.life=-1;P.inv=.18}}else for(let e of [...S.en])if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){hit(e,b);if(--b.p<0){b.life=-1;break}}}S.bu=S.bu.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y>50&&b.y<H+50);for(let e of S.en){let a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;if((e.type==='spitter'||e.boss)&&--e.shot<=0){e.shot=e.boss?.75:2.2;let n=e.boss?8:1;for(let i=0;i<n;i++){let q=e.boss?i*Math.PI*2/n:a;S.bu.push({x:e.x,y:e.y,vx:Math.cos(q)*260,vy:Math.sin(q)*260,r:e.boss?7:5,dmg:e.boss?17:e.dmg,life:4,enemy:1,p:99})}}if(Math.hypot(P.x-e.x,P.y-e.y)<P.r+e.r&&P.inv<=0){P.hp-=e.dmg*dt*2;P.inv=.03}}for(let g of S.gem){let d=Math.hypot(P.x-g.x,P.y-g.y);if(d<P.mag){let a=Math.atan2(P.y-g.y,P.x-g.x);g.x+=Math.cos(a)*320*dt;g.y+=Math.sin(a)*320*dt}if(d<25){xp(g.v);g.dead=1}}S.gem=S.gem.filter(g=>!g.dead);if(P.hp<=0)end()}function poly(cx,cy,r,n,rot=0){x.beginPath();for(let i=0;i<n;i++){let a=i*Math.PI*2/n+rot;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.closePath();x.fill()}function draw(){let bio=BI[Math.floor((S.w-1)/5)%BI.length];x.fillStyle=bio[1];x.fillRect(0,0,W,H);x.strokeStyle=bio[2]+'55';for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,60);x.lineTo(i,H);x.stroke()}for(let j=60;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}for(let o of S.obs){x.fillStyle='#293342';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()}for(let g of S.gem){x.fillStyle='#55eaff';poly(g.x,g.y,7,4,Math.PI/4)}for(let b of S.bu){x.fillStyle=b.enemy?'#ff527d':'#72ebff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}for(let e of S.en)alien(e);ship();lv.textContent='Lv '+P.lv;wa.textContent='Wave '+S.w;ki.textContent=S.k;sc.textContent=S.score;go.textContent=S.gold;hp.style.width=Math.max(0,P.hp/P.mhp*100)+'%';xp.style.width=Math.min(100,P.xp/P.nxp*100)+'%';let B=S.en.find(e=>e.boss);bb.style.display=B?'block':'none';if(B){bn.textContent=B.name;bh.style.width=B.hp/B.mhp*100+'%'}}function ship(){let a=Math.atan2(M.y-P.y,M.x-P.x);x.save();x.translate(P.x,P.y);x.rotate(a);x.shadowBlur=18;x.shadowColor='#54e9ff';let g=x.createLinearGradient(-28,-15,28,15);g.addColorStop(0,'#26384d');g.addColorStop(.5,'#b7c9d4');g.addColorStop(1,'#273549');x.fillStyle=g;x.beginPath();x.moveTo(32,0);x.lineTo(7,-10);x.lineTo(-7,-19);x.lineTo(-20,-13);x.lineTo(-12,-5);x.lineTo(-31,0);x.lineTo(-12,5);x.lineTo(-20,13);x.lineTo(-7,19);x.lineTo(7,10);x.closePath();x.fill();x.fillStyle='#67edff';x.beginPath();x.ellipse(7,0,7,4,0,0,7);x.fill();x.restore()}function alien(e){x.save();x.translate(e.x,e.y);x.shadowBlur=e.boss?28:10;x.shadowColor=e.col;x.fillStyle=e.col;if(e.boss){for(let i=0;i<10;i++){let a=i*Math.PI/5;x.strokeStyle=e.col;x.lineWidth=6;x.beginPath();x.moveTo(Math.cos(a)*25,Math.sin(a)*25);x.lineTo(Math.cos(a)*e.r*1.55,Math.sin(a)*e.r*1.35);x.stroke()}x.fillStyle='#2b0716';x.beginPath();x.arc(0,0,e.r,0,7);x.fill();x.fillStyle='#ffe6da';x.beginPath();x.ellipse(8,0,26,15,0,0,7);x.fill();x.fillStyle='#090006';x.beginPath();x.ellipse(16,0,7,13,0,0,7);x.fill()}else if(e.type==='stalker'){poly(0,0,e.r,3)}else if(e.type==='brute'){x.beginPath();x.arc(0,0,e.r,0,7);x.fill();x.fillStyle='#21152e';for(let i=0;i<6;i++){let a=i*Math.PI/3;x.beginPath();x.arc(Math.cos(a)*16,Math.sin(a)*16,5,0,7);x.fill()}}else if(e.type==='spitter'){poly(0,0,e.r,5);x.fillStyle='#061d19';x.beginPath();x.arc(0,0,7,0,7);x.fill()}else{poly(0,0,e.r,7)}x.restore()}function end(){S.run=0;save();res.innerHTML='Pilot: <b>'+esc(S.pilot)+'</b><br>Score: <b>'+S.score+'</b><br>Wave: <b>'+S.w+'</b><br>Kills: <b>'+S.k+'</b><br>Lifesteal: <b>'+Math.round(P.ls*100)+'%</b>';over.style.display='flex'}function getB(){try{return JSON.parse(localStorage.getItem('neonfall_global_local')||'[]')}catch{return[]}}function save(){let b=getB();b.push({n:S.pilot,s:S.score,w:S.w,k:S.k});b.sort((a,b)=>b.s-a.s);localStorage.setItem('neonfall_global_local',JSON.stringify(b.slice(0,10)))}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showBoard(){let b=getB();tbl.innerHTML=b.length?'<table class="board"><tr><th>#</th><th>Pilot</th><th>Score</th><th>Wave</th><th>Kills</th></tr>'+b.map((q,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(q.n)+'</td><td>'+q.s+'</td><td>'+q.w+'</td><td>'+q.k+'</td></tr>').join('')+'</table>':'Henüz skor yok';board.style.display='flex'}play.onclick=reset;again.onclick=reset;lb0.onclick=lb1.onclick=showBoard;close.onclick=()=>board.style.display='none';let last=performance.now();function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
