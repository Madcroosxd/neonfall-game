name: HUD runtime hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-hotfix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DOM element references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('UI.UI.','UI.')
          s=s.replace("play.onclick=reset","UI.play.onclick=reset")
          s=s.replace("again.onclick=reset","UI.again.onclick=reset")
          s=s.replace("lb0.onclick=lb1.onclick=showBoard","UI.lb0.onclick=UI.lb1.onclick=showBoard")
          s=s.replace("close.onclick=()=>board.style.display='none'","UI.closeBtn.onclick=()=>UI.board.style.display='none'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add index.html
            git commit -m 'Fix duplicated UI references'
            git push
          fi
