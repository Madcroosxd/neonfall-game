name: HUD runtime hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-hotfix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch remaining UI references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          while 'UI.UI.' in s:
              s=s.replace('UI.UI.','UI.')
          s=s.replace(";over.style.display='flex'",";UI.over.style.display='flex'")
          s=s.replace("UI.play.onclick=reset","UI.play.onclick=reset")
          s=s.replace("UI.again.onclick=reset","UI.again.onclick=reset")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add index.html
            git commit -m 'Fix Start Run event handlers and game over UI'
            git push
          fi
